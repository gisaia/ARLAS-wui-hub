@if (isLoading()) {
<div class="spinner">
    <mat-spinner></mat-spinner>
</div>
}

<json-editor [options]="editorOptions" #editor></json-editor>

<div class="actions">
    <button matButton="outlined" (click)="getSample(false, true)" [disabled]="isLoading() || currentSampleIndex() === 0">
        « {{ 'Previous' | translate }}</button>
    <button matButton="outlined" (click)="getSample(false)" [disabled]="isLoading()">
        {{ 'Next' | translate }} »</button>
</div>
